<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnkaPrime - Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect trick.
      // When GitHub Pages can't find a file, it serves THIS 404.html.
      // We read the path, strip the base, and redirect to the hash-based route
      // so React's hash router picks it up correctly.
      var path = window.location.pathname;

      // If it's not the root and it doesn't look like an asset or file, redirect to hash route
      if (path !== '/' && !path.includes('/assets/') && !path.includes('.')) {
        var route = path.slice(1); // remove leading slash
        window.location.replace('/#' + route);
      }
    </script>
  </head>
  <body>
    <p style="font-family:sans-serif;text-align:center;margin-top:20vh;color:#555">
      Redirecting…
    </p>
  </body>
</html>
