<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enka Prime Consulting</title>
    <script>
      // GitHub Pages SPA fallback — stores path in sessionStorage then redirects to /
      // index.html reads sessionStorage and restores the path via history.replaceState
      // This lets React Router / pushState routing work on GitHub Pages
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      // Save the intended path
      sessionStorage.setItem('spa_redirect', path + search + hash);
      // Redirect to the root which loads the SPA
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p style="font-family:sans-serif;text-align:center;margin-top:20vh;color:#555">
      Redirecting to Enka Prime…
    </p>
  </body>
</html>
