<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enka Prime Consulting</title>
    <script>
      // GitHub Pages SPA fallback
      // IMPORTANT: Only redirect actual SPA routes — never redirect static files
      var path = window.location.pathname;
      var ext = path.split('.').pop().toLowerCase();
      
      // List of static file extensions that should NOT be redirected
      var staticExts = ['xml', 'txt', 'json', 'png', 'jpg', 'jpeg', 'gif', 'svg', 'ico', 'css', 'js', 'pdf', 'woff', 'woff2'];
      
      if (staticExts.indexOf(ext) !== -1) {
        // It's a static file that genuinely doesn't exist — show nothing
        document.write('<p style="font-family:sans-serif;text-align:center;margin-top:20vh;color:#555">File not found.</p>');
      } else {
        // It's an SPA route — save path and redirect to root
        sessionStorage.setItem('spa_redirect', path + window.location.search + window.location.hash);
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <p style="font-family:sans-serif;text-align:center;margin-top:20vh;color:#555">
      Redirecting…
    </p>
  </body>
</html>
